<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Info Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <h1>USER INFORMATION CARD</h1>
            <p class="subtitle">Enter your information below</p>
        </header>


        <div class="content">

            <!-- LEFT SIDE: USER INPUT -->
            <section class="input-section">

                <h2>User Information</h2>

                <form id="userForm">

                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Enter your first name">
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Enter your last name">
                    </div>

                    <div class="form-group email-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="Enter your age">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number">
                    </div>

                    <div class="form-group">
                        <label for="birthday">Birthday</label>
                        <input type="date" id="birthday">
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" placeholder="Enter your address">
                    </div>

                    <div class="form-group">
                        <label for="course">Course / Program</label>
                        <input type="text" id="course" placeholder="Enter your course">
                    </div>

                    <div class="form-group">
                        <label for="school">School</label>
                        <input type="text" id="school" placeholder="Enter your school">
                    </div>

                    <div class="form-group">
                        <label for="hobby">Favorite Hobby</label>
                        <input type="text" id="hobby" placeholder="Enter your hobby">
                    </div>

                    <div class="form-group">
                        <label for="website">Personal Website</label>
                        <input type="url" id="website" placeholder="https://example.com">
                    </div>

                    <div class="form-group">
                        <label>Favorite Color</label>

                        <div class="radio-group">

                            <label>
                                <input type="radio" name="favoriteColor" value="Red">
                                Red
                            </label>

                            <label>
                                <input type="radio" name="favoriteColor" value="Blue">
                                Blue
                            </label>

                            <label>
                                <input type="radio" name="favoriteColor" value="Green">
                                Green
                            </label>

                            <label>
                                <input type="radio" name="favoriteColor" value="Yellow">
                                Yellow
                            </label>

                        </div>
                    </div>

                    <div class="form-group">
                        <label for="country">Country</label>

                        <select id="country">
                            <option value="">-- Select Country --</option>
                            <option value="Philippines">Philippines</option>
                            <option value="Japan">Japan</option>
                            <option value="South Korea">South Korea</option>
                            <option value="United States">United States</option>
                            <option value="Canada">Canada</option>
                            <option value="Thailand">Thailand</option>
                        </select>
                    </div>

                    <button type="submit" id="showInfo">
                        Show My Info
                    </button>

                </form>

            </section>


            <!-- RIGHT SIDE: OUTPUT -->
            <section id="outputSection" class="output-section">

                <h2>My Information</h2>

                <div id="infoOutput" class="info-card">

                    <p class="placeholder">
                        Your information will appear here.
                    </p>

                </div>

            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
